[project]
name = "coffee-assistant"
version = "0.1.0"
description = "RAG assistant for coffee questions, with evaluated retrieval and answer quality"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dlt[duckdb]>=1.30.0",
    "gitsource>=0.0.5",
    "jupyter>=1.1.1",
    "minsearch>=0.2.0",
    "numpy>=2.5.2",
    "onnxruntime>=1.29.0",
    "openai>=3.6.0",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
    "tokenizers>=0.23.2",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "huggingface-hub>=1.30.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]       # add the repo root to the search path -> coffee_assistant is found
testpaths = ["tests"]    # only look for tests in tests/ (faster, skips notebooks/.venv)
